name: Publish Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: keyrate-linux-x64
          - name: linux-arm64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset: keyrate-linux-arm64
            cross: true
          - name: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            asset: keyrate-macos-x64
          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            asset: keyrate-macos-arm64
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: keyrate-windows-x64.exe
          - name: windows-arm64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            asset: keyrate-windows-arm64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux cross-compiler
        if: matrix.cross
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }}

      - name: Run tests (primary target only)
        if: matrix.name == 'linux-x64'
        run: cargo test

      - name: Rename binary
        shell: bash
        run: cp target/${{ matrix.target }}/release/keyrate ${{ matrix.asset }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "keyrate ${{ github.ref_name }}"
          body: |
            Automated release built from tag `${{ github.ref_name }}`.

            ## Install
            ```bash
            npx keyrate
            ```
          files: dist/keyrate-*
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false

  publish-npm:
    name: Publish to npm
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
