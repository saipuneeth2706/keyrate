[package]
name = "keyrate"
version = "2.2.0"
edition = "2024"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
color-eyre = "0.6"
rand = "0.8"
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
